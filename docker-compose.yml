services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privacy_agent
      POSTGRES_USER: privacy
      POSTGRES_PASSWORD: privacy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacy -d privacy_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  privacy-api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./secrets:/app/secrets
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
